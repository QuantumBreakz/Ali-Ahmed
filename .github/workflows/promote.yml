name: Promote new posts

on:
  push:
    branches: [main]
    paths: ["src/content/blog/**"]
  workflow_dispatch:
  # Daily drip: Telegraph and Blogger publish a few summaries per run until every post is covered.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Index and cross-post
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Find posts added by this push
        id: new
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          slugs=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            slugs=$(git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'src/content/blog/*.md' 'src/content/blog/*.mdx' \
              | xargs -r -n1 basename | sed -E 's/\.mdx?$//' | grep -E '^[a-z0-9-]+$' | tr '\n' ' ' || true)
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "New posts: ${slugs:-none}"

      - name: Wait for Cloudflare to deploy them
        env:
          SLUGS: ${{ steps.new.outputs.slugs }}
        run: |
          if [ -z "$SLUGS" ]; then [ "$GITHUB_EVENT_NAME" = push ] && sleep 300; exit 0; fi
          for slug in $SLUGS; do
            for attempt in $(seq 1 80); do
              curl --silent --fail --output /dev/null "https://aliahmed.si/blog/$slug.md" && break
              [ "$attempt" = 80 ] && { echo "$slug is not live after 20 minutes"; exit 1; }
              sleep 15
            done
            echo "$slug is live"
          done

      - name: Submit the sitemap to IndexNow
        if: github.event_name != 'schedule'
        run: node scripts/promote/indexnow.mjs

      - name: Submit the sitemap to Google Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then echo "GSC_SERVICE_ACCOUNT_JSON secret not set; skipping Search Console."; exit 0; fi
          [ -n "$GSC_SITE" ] || unset GSC_SITE
          node scripts/promote/gsc-sitemap.mjs

      - name: Cross-post to DEV
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then echo "DEVTO_API_KEY secret not set; skipping DEV."; exit 0; fi
          node scripts/promote/devto.mjs --publish --limit 8

      - name: Publish code as GitHub Gists
        if: ${{ !cancelled() }}
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then echo "GIST_TOKEN secret not set; skipping Gists."; exit 0; fi
          node scripts/promote/gists.mjs --publish

      - name: Publish summaries on Telegraph
        if: ${{ !cancelled() }}
        env:
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          # Only used once, to save TELEGRAPH_TOKEN as a secret when it's missing.
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$TELEGRAPH_TOKEN" ] && [ -z "$GH_TOKEN" ]; then echo "No TELEGRAPH_TOKEN or GIST_TOKEN; skipping Telegraph."; exit 0; fi
          node scripts/promote/telegraph.mjs --publish --limit 5

      - name: Publish summaries on Blogger
        if: ${{ !cancelled() && vars.BLOGGER_PAUSED != 'true' }}
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          if [ -z "$BLOGGER_REFRESH_TOKEN" ]; then echo "Blogger secrets not set; skipping Blogger."; exit 0; fi
          node scripts/promote/blogger.mjs --publish --limit 10

      - name: Report Search Console index status
        if: ${{ !cancelled() && github.event_name != 'push' }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then echo "GSC_SERVICE_ACCOUNT_JSON secret not set; skipping."; exit 0; fi
          [ -n "$GSC_SITE" ] || unset GSC_SITE
          node scripts/promote/gsc-inspect.mjs | tee -a "$GITHUB_STEP_SUMMARY"
